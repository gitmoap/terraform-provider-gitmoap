name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Generated code and documentation are up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Run make generate and commit the result."
            exit 1
          fi
      - name: Examples are valid
        run: make examples
      - run: go vet ./...
      - run: go test ./...
